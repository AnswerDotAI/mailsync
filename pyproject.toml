[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailsync"
dynamic = ["version"]
description = "A searchable local mirror of Gmail"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "apsw>=3.53.4.0",
  "fastcore>=2.2.18",
  "fastgws>=0.2.8",
]

[project.scripts]
mailsync = "mailsync.cli:main"
mailsync-search = "mailsync.cli:search"
mailsync-status = "mailsync.cli:status"
mailsync-backup = "mailsync.cli:backup"

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/mailsync"

[tool.setuptools.dynamic]
version = { attr = "mailsync.__version__" }

[tool.setuptools.packages.find]
include = ["mailsync"]
